  services:
  - type: web
    name: rehema-community-empowerment-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://rehema-website-preview-2026-1028.onrender.com
      - key: API_PUBLIC_URL
        value: https://rehema-community-empowerment-api.onrender.com
      - key: ADMIN_NAME
        value: REHEMA Administrator
      - key: ADMIN_EMAIL
        value: rehemainfo@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: FLW_CURRENCY
        value: UGX

  - type: web
    name: rehema-website-preview-2026-1028
    runtime: static
    rootDir: Client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://rehema-community-empowerment-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
